name: Build D.A.V.I.S. ULTRA JARVIS APK

on:
workflow_dispatch:
push:
branches:
- main
- principal

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      cache: true

  - name: Check Flutter installation
    run: flutter --version

  - name: Check project files
    run: |
      test -f pubspec.yaml || (echo "ERREUR: pubspec.yaml manke nan rasin pwojè a" && exit 1)
      test -f lib/main.dart || (echo "ERREUR: lib/main.dart manke" && exit 1)

  - name: Get Flutter dependencies
    run: flutter pub get

  - name: Check Dart code
    run: flutter analyze --no-pub

  - name: Build release APK
    run: flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: DAVIS-ULTRA-JARVIS-APK
      path: build/app/outputs/flutter-apk/app-release.apk
      if-no-files-found: error
      retention-days: 7
